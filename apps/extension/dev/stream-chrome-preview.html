<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stream chrome preview (original header, no footer / no "Live now")</title>
<link rel="stylesheet" href="../src/content/knoww-inline.css" />
<style>
  body { margin: 0; background: #0e0e10; padding: 40px;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .label { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#adadb8; margin-bottom:10px; }
  #knoww-notification-stack { position: static; width: 340px; inset: auto; max-height: none; }
</style>
</head>
<body>

<div class="label">Stream chrome · original header icons · NO footer · NO "Live now" label</div>
<!-- knoww-stack-stream → CSS hides the footer + the "Live now" section header,
     but the original header icons are restored (kebab reverted). -->
<div id="knoww-notification-stack" class="knoww-notification-stack knoww-stack-stream">
  <div class="knoww-stack-header">
    <div class="knoww-stack-title"><span class="knoww-stack-icon" aria-hidden="true">▣</span><span>Markets</span></div>
    <div class="knoww-stack-header-right">
      <button type="button" class="knoww-stack-settings">⚙</button>
      <button type="button" class="knoww-stack-sidebar">⊡</button>
      <button type="button" class="knoww-search-toggle">🔍</button>
      <button type="button" class="knoww-stack-minimize">⌄</button>
      <button type="button" class="knoww-stack-close">✕</button>
    </div>
  </div>
  <!-- This "Live now" section header should be hidden by the stream CSS -->
  <div class="knoww-stack-section-header">
    <span class="knoww-stack-section-title"><span class="knoww-stack-section-dot active" aria-hidden="true"></span>Live now</span>
    <span class="knoww-stack-section-count">12</span>
  </div>
  <div class="knoww-notification-item knoww-notification-item--stream knoww-source-polymarket">
    <div class="knoww-notification-icon" style="background:#c9742a;color:#fff;">🔫</div>
    <div class="knoww-notification-content">
      <div class="knoww-stream-pill">
        <span class="knoww-stream-pill-title">Counter-Strike: Donstu Esports vs INFURITY Gaming</span>
        <span class="knoww-stream-pill-chev" aria-hidden="true">⌄</span>
      </div>
    </div>
    <div class="knoww-stream-bet"></div>
  </div>
  <!-- This footer should be hidden by the stream CSS -->
  <div class="knoww-stack-footer" id="knoww-stack-footer">
    <span class="knoww-stack-footer-live" id="knoww-stack-footer-live">● LIVE · 18:45</span>
    <span class="knoww-stack-footer-see-all">SEE ALL →</span>
  </div>
</div>

</body>
</html>
