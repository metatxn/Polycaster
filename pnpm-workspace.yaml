packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: true
minimumReleaseAgeExclude:
  # Security-fix escape hatches: each of these is the *only* published version
  # that clears an open advisory, and each is still inside the 7-day window.
  # Drop the entry once the pinned version ages past the gate on its own.
  - "brace-expansion"
  - "fast-uri"
  - "hono"
  - "@protobufjs/eventemitter"
  - "@protobufjs/fetch"
  - "@protobufjs/inquire"
  - "@protobufjs/utf8"
  - "protobufjs"
  - "qs"
  - "ws"
  - "form-data"
  - "undici"
  - "esbuild"
  - "@esbuild/*"
  - "@polymarket/client"
  - "@polymarket/types"
  - "@polymarket/bindings"
  - "nanoid"
  - "dompurify"

catalog:
  "@biomejs/biome": "2.5.6"
  "@polymarket/client": "0.2.0"
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.4"
  "decimal.js": "^10.6.0"
  "react": "19.2.8"
  "react-dom": "19.2.8"
  "react-qr-code": "2.2.0"
  "typescript": "6.0.3"
  "viem": "2.55.10"

packageExtensions:
  "@metamask/connect-multichain@0.12.1":
    dependencies:
      "debug": "^4.4.3"

peerDependencyRules:
  allowedVersions:
    "typescript": "6"

overrides:
  "typescript": "6.0.3"
  "viem": "2.55.10"
  "axios": "1.18.1"
  # 5.0.1 is the newest published @isaacs/brace-expansion; the previous 5.0.6
  # pin was an unresolvable version carried over from the brace-expansion fork.
  "@isaacs/brace-expansion": "5.0.1"
  # Unbounded-intermediate-array DoS that bypasses the CVE-2026-14257
  # mitigation; only fixed in >=5.0.9. Release-age gate waived above.
  "brace-expansion": "5.0.9"
  "fast-xml-parser": "5.10.1"
  "qs": "6.15.3"
  "body-parser": "2.3.0"
  "h3": "1.15.11"
  # GHSA CORS-middleware ReDoS via Access-Control-Request-Headers is only
  # fixed in >=4.12.34. Staying on the 4.12 line rather than 4.13.0.
  # Release-age gate waived above.
  "hono": "4.12.34"
  "postcss": "8.5.24"
  # GHSA-2v37-7h3g-55p8: a custom alphabet with size 0 spins forever. Fixed on
  # the 3.x line in 3.3.17 — the floor the advisory names, and all postcss
  # (^3.3.11) needs. Release-age gate waived above; drop the waiver after
  # 2026-08-10, when 3.3.17 ages past the gate on its own.
  "nanoid": "3.3.17"
  "minimatch": "10.2.6"
  "lodash": "4.18.1"
  "bn.js": "4.12.3"
  "undici": "7.29.0"
  "socket.io-parser": "4.2.7"
  "path-to-regexp": "8.4.2"
  "defu": "6.1.7"
  "protobufjs": "7.6.5"
  "uuid": "11.1.1"
  # CVE-2026-18446 host confusion via backslash authority introducer: patched
  # in 3.1.5 / 4.1.2 only (4.1.1 is still vulnerable, so bumping the major
  # would not help). Release-age gate waived above.
  "fast-uri": "3.1.5"
  "ws": "8.21.2"
  "shell-quote": "1.10.0"
  "esbuild": "0.28.1"
  "form-data": "4.0.6"
  "vite": "8.2.0"
  # GHSA-55q2-fjhq-7xh7: with IN_PLACE, a hook that detaches a node leaves the
  # subtree sanitized-but-executable → XSS. Only fixed in >=3.4.13. Reached via
  # posthog-js. Release-age gate waived above; drop the waiver after
  # 2026-08-10, when 3.4.13 ages past the gate on its own.
  "dompurify": "3.4.13"
  # CVE-2026-59870: quadratic CPU blow-up parsing `!!omap` keys. Fixed on the
  # v4 line in 4.3.1 (`v4-legacy` tag) — reached via webpack-cli, so a major
  # bump to 5.x is unnecessary. Past the release-age gate on its own.
  "js-yaml": "4.3.1"
  # @huggingface/transformers declares sharp ^0.34.5, which is below the
  # >=0.35.0 advisory floor. The extension never imports sharp and webpack
  # does not bundle it, so lifting it also dedupes against the root 0.35.3.
  "sharp": "0.35.3"
  # GHSA-frvp-7c67-39w9 (Windows serve-static path traversal via %5C) is only
  # fixed in >=2.0.5, so the whole 1.x line stays vulnerable. Reached via
  # apps/web > accounts > wata, which declares ^1.13.7 but imports exactly one
  # root symbol (`getRequestListener`) — present and unchanged in 2.x.
  "@hono/node-server": "2.0.12"
  # Force patched adm-zip (GHSA-xcpc-8h2w-3j85: crafted ZIP → 4GB alloc).
  # Pulled transitively via @huggingface/transformers > onnxruntime-node,
  # which still declares ^0.5.16; the override lifts it past the fix.
  "adm-zip": "0.6.0"

allowBuilds:
  "@reown/appkit": true
  "bufferutil": true
  "core-js": true
  "esbuild": true
  "onnxruntime-node": true
  "protobufjs": true
  "sharp": true
  "utf-8-validate": true
  "workerd": true
