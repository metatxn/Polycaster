packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: true
minimumReleaseAgeExclude:
  - "@protobufjs/eventemitter"
  - "@protobufjs/fetch"
  - "@protobufjs/inquire"
  - "@protobufjs/utf8"
  - "protobufjs"
  - "qs"
  - "ws"
  - "form-data"
  - "undici"
  - "esbuild"
  - "@esbuild/*"
  - "@polymarket/client"
  - "@polymarket/types"
  - "@polymarket/bindings"

catalog:
  "@biomejs/biome": "2.5.2"
  "@polymarket/client": "0.1.0-beta.18"
  "@types/react": "19.2.17"
  "@types/react-dom": "19.2.3"
  "decimal.js": "^10.6.0"
  "react": "19.2.7"
  "react-dom": "19.2.7"
  "react-qr-code": "2.2.0"
  "typescript": "6.0.3"
  "viem": "2.55.1"

packageExtensions:
  "@metamask/connect-multichain@0.12.1":
    dependencies:
      "debug": "^4.4.3"

peerDependencyRules:
  allowedVersions:
    "typescript": "6"

overrides:
  "typescript": "6.0.3"
  "viem": "2.55.1"
  "axios": "1.18.0"
  "@isaacs/brace-expansion": "5.0.6"
  "brace-expansion": "5.0.6"
  "fast-xml-parser": "5.9.3"
  "qs": "6.15.2"
  "body-parser": "2.3.0"
  "h3": "1.15.11"
  "hono": "4.12.26"
  "postcss": "8.5.15"
  "minimatch": "10.2.5"
  "lodash": "4.18.1"
  "bn.js": "4.12.3"
  "undici": "7.28.0"
  "socket.io-parser": "4.2.6"
  "path-to-regexp": "8.4.2"
  "defu": "6.1.7"
  "protobufjs": "7.6.4"
  "uuid": "11.1.1"
  "fast-uri": "3.1.2"
  "ws": "8.21.0"
  "shell-quote": "1.8.4"
  "esbuild": "0.28.1"
  "form-data": "4.0.6"
  "vite": "8.1.3"
  "dompurify": "3.4.11"

allowBuilds:
  "@reown/appkit": true
  "bufferutil": true
